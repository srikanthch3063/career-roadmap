name: "Load & Performance Automation Testing"

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install exceljs autocannon

      - name: Run Load Testing
        run: node utils/load-test.js

      - name: Upload Load Performance Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-performance-results
          path: "Load-Performance-Report.xlsx"
