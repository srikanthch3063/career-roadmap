name: "Security & Vulnerability Automation Audit"

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install exceljs

      - name: Run Security Automation Audit
        run: node utils/generate-security-excel.js

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: "Vulnerability Test Results/*"
