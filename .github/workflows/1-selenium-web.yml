name: "React JS Web Selenium E2E Automation"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install xlsx selenium-webdriver

      - name: Run Selenium E2E Web Tests (300 cases with logs)
        run: |
          echo "## Selenium E2E — Web Frontend" >> $GITHUB_STEP_SUMMARY
          echo "Tester: Senior QA Engineer | Date: $(date +%F)" >> $GITHUB_STEP_SUMMARY
          node selenium-tests/tests/login-tests.js 2>&1 | tee selenium.log
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Execution Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat selenium.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish Test Cases to Actions Summary (with name)
        run: node utils/publish-selenium-summary.js

      - name: Upload Selenium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            selenium-tests/selenium-test-report.xlsx
            selenium.log
          if-no-files-found: error
